<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunar Rescue</title>
<style>
:root{color-scheme:dark;--ink:#e8eef7;--acc:#ffb347;--ok:#5cf2a5;--bad:#ff5d5d;--pn:rgba(10,16,28,.78)}
html,body{margin:0;height:100%;background:#05070d;color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:210px;background:var(--pn);border:1px solid #ffffff22;border-radius:10px;padding:10px;font-size:11px;letter-spacing:.08em}
.g{margin-bottom:7px}.g label{display:flex;justify-content:space-between;opacity:.8;margin-bottom:3px}
.g i{display:block;height:7px;background:#ffffff18;border-radius:4px;overflow:hidden}
.g b{display:block;height:100%;width:100%;background:var(--ok);transition:background .2s}
.g b.lo{background:var(--bad)}.g b.mid{background:var(--acc)}
#tel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;text-align:center;margin-top:8px}
#tel span{background:#ffffff0d;border-radius:5px;padding:4px 0}#tel .x{color:var(--bad)}
#msg{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--pn);border:1px solid #ffffff22;padding:8px 16px;border-radius:20px;font-size:13px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#02040a99;backdrop-filter:blur(3px);z-index:5}
#ov.hide{display:none}
.pn{background:#0b1220ee;border:1px solid #ffffff2a;border-radius:16px;padding:26px 30px;max-width:560px;max-height:92vh;overflow:auto;text-align:center;box-shadow:0 20px 60px #000a}
.pn h1{margin:0 0 4px;font-size:26px;letter-spacing:.14em;color:var(--acc)}
.pn p{line-height:1.6;font-size:13px;opacity:.9}
.pn kbd{background:#ffffff1a;border-radius:4px;padding:1px 6px}
.dr{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px;text-align:left}.dr span{width:128px;opacity:.85}.dr select,.dr input{flex:1;min-width:0;font:inherit;background:#0e1830;color:var(--ink);border:1px solid #ffffff33;border-radius:6px;padding:4px}.dr b{width:30px;text-align:right}button:disabled{cursor:not-allowed}#tst{position:fixed;top:24%;left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--acc);color:var(--acc);padding:10px 18px;border-radius:12px;font-weight:700;letter-spacing:.08em;opacity:0;transition:opacity .4s;pointer-events:none;z-index:6;font-size:13px}#pf{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;opacity:.9}
#ctl{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 54px);display:flex;gap:6px;z-index:1}#ctl button{padding:6px 10px;font-size:10px;background:var(--pn);color:var(--ink);border:1px solid #ffffff33}.ex{margin-top:14px;display:flex;flex-direction:column;gap:9px}.ex a{color:var(--acc);font-size:13px;text-decoration:none}.ex a:hover{text-decoration:underline}
button{font:inherit;font-weight:700;letter-spacing:.12em;background:var(--acc);color:#1a1000;border:0;border-radius:10px;padding:12px 26px;cursor:pointer}
button:hover{filter:brightness(1.1)}
#touch{position:fixed;inset:auto 0 calc(env(safe-area-inset-bottom,0px) + 60px) 0;display:none;justify-content:space-between;padding:0 16px;pointer-events:none}
#touch div{pointer-events:auto;width:76px;height:76px;border-radius:50%;background:#ffffff1c;border:2px solid #ffffff44;display:flex;align-items:center;justify-content:center;font-size:28px}
#touch .r{display:flex;gap:12px}
body.cin #hud,body.cin #msg,body.cin #touch,body.cin #ctl{display:none!important}
@media (pointer:coarse){#touch{display:flex}}

/* ===== LUNAR RESCUE · story intro (lab) ===== */
#lri{position:fixed;inset:0;z-index:8;pointer-events:none;font-family:ui-monospace,Menlo,Consolas,monospace;color:#dff6ff;-webkit-tap-highlight-color:transparent}
#lri canvas#lrc{position:absolute;inset:0;width:100%;height:100%;pointer-events:auto;touch-action:none}
#lri .lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .9s cubic-bezier(.2,.8,.2,1);z-index:2}
#lri .lb.t{top:0}#lri .lb.b{bottom:0}#lri.cine .lb{height:9vh}
#lrh{position:absolute;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:10px 14px;background:rgba(6,18,36,.72);border:1px solid rgba(90,220,255,.35);border-radius:10px;font-size:11px;letter-spacing:.12em;backdrop-filter:blur(4px);transition:opacity .5s;max-width:calc(100vw - 150px);box-sizing:border-box}
#lrh b{display:block;color:#7fe9ff;font-size:12px;margin-bottom:4px}
#lrh span{opacity:.88}
#lrs{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);padding:8px 12px;font-size:10px;letter-spacing:.14em;border:1px solid rgba(255,255,255,.28);border-radius:8px;background:rgba(6,18,36,.6);cursor:pointer;pointer-events:auto;z-index:4;transition:opacity .5s}
#lrs:hover{background:rgba(40,90,140,.6)}
#lrk{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:9px 14px;background:rgba(6,18,36,.7);border:1px solid rgba(90,220,255,.28);border-radius:10px;font-size:11px;letter-spacing:.08em;line-height:1.8;transition:opacity 1s}
#lrk kbd{background:#ffffff1c;border-radius:4px;padding:1px 6px;margin:0 1px}
#lrk.gone{opacity:0}
#lrw{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);transform:translateX(-50%);font-size:10px;color:#ffb347;opacity:.85;text-align:center;max-width:92vw;pointer-events:none;z-index:5}
#lri.cine #lrh,#lri.cine #lrk,#lri.cine #lrt,#lri.cine #lrs{opacity:0;pointer-events:none}
#lrt{position:absolute;inset:auto 0 calc(env(safe-area-inset-bottom,0px) + 18px) 0;display:none;justify-content:space-between;padding:0 16px;pointer-events:none;z-index:3}
#lrt .g{display:flex;gap:12px}
#lrt div[data-k]{pointer-events:auto;width:70px;height:70px;border-radius:50%;background:#ffffff1c;border:2px solid #ffffff44;display:flex;align-items:center;justify-content:center;font-size:26px;touch-action:none;transition:background .2s,box-shadow .2s}
#lrt div[data-k="e"]{font-weight:700;font-size:24px;color:#7fe9ff}
#lrt div[data-k="e"].hot{background:rgba(70,200,255,.45);box-shadow:0 0 22px #5fe3ffcc;border-color:#9ef0ff}
@media (pointer:coarse){#lrt{display:flex}#lrk{display:none}}
#lri.touchy #lrt{display:flex}#lri.touchy #lrk{display:none}
#lrd{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh + 14px);transform:translate(-50%,36px);width:min(860px,94vw);box-sizing:border-box;z-index:3;display:flex;gap:16px;align-items:stretch;background:linear-gradient(180deg,rgba(8,22,42,.93),rgba(4,11,24,.96));border:1px solid var(--c,#5fe3ff);border-radius:16px;padding:14px 18px;box-shadow:0 0 0 1px #000,0 0 38px color-mix(in srgb,var(--c,#5fe3ff) 35%,transparent),inset 0 0 30px rgba(60,200,255,.07);opacity:0;pointer-events:none;transition:opacity .45s,transform .45s,border-color .3s;cursor:pointer}
#lrd.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#lrav{position:static;inset:auto;display:block;flex:none;width:92px;height:92px;border-radius:50%;border:2px solid var(--c,#5fe3ff);box-shadow:0 0 18px var(--c,#5fe3ff);background:#0a1a30;align-self:flex-start}
.lrb{flex:1;min-width:0;display:flex;flex-direction:column}
#lrn{font-weight:700;letter-spacing:.2em;font-size:12px;margin-bottom:6px;padding-left:10px;border-left:3px solid currentColor}
#lrx{font-size:clamp(14px,2.3vw,19px);line-height:1.55;min-height:3.1em;color:#f2fbff}
#lrx::after{content:'▌';opacity:.7;animation:lrbl .8s steps(1) infinite;margin-left:2px}
.lrf{display:flex;justify-content:flex-end;align-items:center;gap:12px;font-size:10px;letter-spacing:.14em;opacity:.8;margin-top:6px}
#lrnx{padding:7px 14px;border:1px solid var(--c,#5fe3ff);border-radius:8px;color:var(--c,#5fe3ff);opacity:.35;transition:opacity .3s,background .3s}
#lrnx.rdy{opacity:1;animation:lrpu 1.1s ease-in-out infinite}
@keyframes lrbl{50%{opacity:0}}
@keyframes lrpu{50%{background:rgba(120,230,255,.18);transform:translateX(3px)}}
@media (max-width:560px){#lrav{width:56px;height:56px}#lrd{padding:11px 12px;gap:10px}#lrp{display:none}}
/* mission popup */
#lrm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .6s,visibility 0s .6s;background:radial-gradient(ellipse at 50% 12%,rgba(26,74,128,.78),rgba(3,8,20,.97) 64%);backdrop-filter:blur(8px);z-index:6;overflow:auto;padding:12px;box-sizing:border-box;touch-action:pan-y}
#lrm.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .6s}
#lrm::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 28% 70%,#cfe,transparent),radial-gradient(1.5px 1.5px at 44% 12%,#fff,transparent),radial-gradient(1px 1px at 63% 82%,#fff,transparent),radial-gradient(1.5px 1.5px at 78% 30%,#cdf,transparent),radial-gradient(1px 1px at 90% 64%,#fff,transparent),radial-gradient(1px 1px at 6% 88%,#fff,transparent),radial-gradient(1.5px 1.5px at 55% 50%,#fff,transparent);animation:lrtw 3.5s ease-in-out infinite alternate}
@keyframes lrtw{from{opacity:.35}to{opacity:1}}
.lrc{position:relative;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;width:min(940px,100%);margin:auto;padding:30px 36px;box-sizing:border-box;border:1px solid rgba(110,230,255,.5);border-radius:20px;background:linear-gradient(160deg,rgba(10,32,60,.9),rgba(4,10,22,.95));box-shadow:0 0 70px rgba(60,170,255,.28),inset 0 0 50px rgba(60,200,255,.07);overflow:hidden}
.lrc::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px)}
.lrc::after{content:'';position:absolute;left:0;right:0;height:90px;top:-90px;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(110,230,255,.12),transparent);animation:lrsc 5s linear infinite}
@keyframes lrsc{to{top:110%}}
#lrm.on .lrc{animation:lrin .85s cubic-bezier(.2,.9,.2,1) both}
#lrm.out .lrc{animation:lrout .7s ease-in both}
@keyframes lrin{from{opacity:0;transform:scale(.82) translateY(30px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes lrout{to{opacity:0;transform:scale(1.12);filter:blur(8px)}}
.lrmoonw{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.lrmoon{position:relative;width:clamp(150px,26vw,270px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:#9a9cab;box-shadow:0 0 70px rgba(190,220,255,.35)}
.lrmoon::before{content:'';position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;box-shadow:inset -46px -24px 70px rgba(0,0,12,.88),inset 10px 8px 30px rgba(255,255,255,.18)}
.lrmoon i{position:absolute;top:0;left:0;height:100%;width:200%;background-repeat:repeat-x;background-size:50% 100%;animation:lrspin 70s linear infinite;background-image:radial-gradient(circle at 14% 28%,rgba(70,72,88,.55) 0 7%,transparent 7.6%),radial-gradient(circle at 33% 62%,rgba(70,72,88,.5) 0 11%,transparent 11.6%),radial-gradient(circle at 21% 80%,rgba(70,72,88,.5) 0 5%,transparent 5.6%),radial-gradient(circle at 45% 24%,rgba(70,72,88,.5) 0 9%,transparent 9.6%),radial-gradient(circle at 5% 55%,rgba(70,72,88,.45) 0 6%,transparent 6.6%),radial-gradient(circle at 40% 88%,rgba(70,72,88,.45) 0 6%,transparent 6.6%),radial-gradient(circle at 12% 28%,rgba(255,255,255,.18) 0 7%,transparent 7.6%),radial-gradient(circle at 31% 60%,rgba(255,255,255,.16) 0 11%,transparent 11.6%),linear-gradient(90deg,#b8bac7,#a2a4b4 50%,#b8bac7)}
@keyframes lrspin{to{transform:translateX(-50%)}}
.lrmoon::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.22),transparent 45%)}
.lrsos{position:absolute;left:62%;top:60%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#ff4a3d;box-shadow:0 0 14px #ff4a3d;z-index:2;animation:lrbk 1s steps(1) infinite}
.lrsos::before,.lrsos::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid #ff5a4d;animation:lrpg 2s ease-out infinite}
.lrsos::after{animation-delay:1s}
@keyframes lrpg{from{transform:scale(1);opacity:.9}to{transform:scale(7);opacity:0}}
@keyframes lrbk{50%{opacity:.35}}
.lrmw{position:relative}
.lrsig{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.14em;color:#ff7a6e;font-weight:700;white-space:nowrap}
.lrsig i{width:9px;height:9px;border-radius:50%;background:#ff4a3d;box-shadow:0 0 10px #ff4a3d;animation:lrbk .8s steps(1) infinite}
.lrwv{display:flex;gap:3px;align-items:center;height:20px}
.lrwv s{display:block;width:3px;background:#ff6a5e;border-radius:2px;height:4px;animation:lrwv 1s ease-in-out infinite}
@keyframes lrwv{50%{height:20px}}
.lrr{position:relative;z-index:1}
.lrk{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.3em;color:#ffb347;padding:4px 10px;border:1px solid #ffb34780;border-radius:6px;animation:lrbk 1.6s ease-in-out infinite}
.lrr h2{margin:12px 0 10px;font-size:clamp(30px,6vw,56px);letter-spacing:.16em;line-height:1;background:linear-gradient(180deg,#fff,#7fe0ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(100,220,255,.35)}
.lrg{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:14px 0}
.lrg dt{opacity:.6;letter-spacing:.14em;font-size:11px;padding-top:2px}
.lrg dd{margin:0;line-height:1.5}
.lrdf{display:inline-flex;gap:4px;vertical-align:middle}.lrdf b{width:20px;height:9px;border-radius:2px;background:#ff8a5c;box-shadow:0 0 8px #ff8a5c88}.lrdf b.o{background:#ffffff26;box-shadow:none}
.lrbr{margin:0 0 18px;padding:10px 14px;border-left:3px solid #5fe3ff;background:rgba(90,200,255,.07);font-size:13px;line-height:1.65;opacity:.95;border-radius:0 8px 8px 0}
#lracc{font-size:15px;padding:15px 34px;letter-spacing:.2em;box-shadow:0 0 0 0 rgba(255,179,71,.6);animation:lrgl 1.6s ease-out infinite}
@keyframes lrgl{to{box-shadow:0 0 0 22px rgba(255,179,71,0)}}
.lrhn{display:inline-block;margin-left:14px;font-size:10px;letter-spacing:.14em;opacity:.55}
@media (max-width:720px){.lrc{grid-template-columns:1fr;gap:14px;padding:20px 18px}.lrmoon{width:clamp(110px,34vw,170px)}.lrr{text-align:left}.lrhn{display:none}#lracc{width:100%}}
@media (pointer:coarse){.lrhn{display:none}}
#lrfade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:20;transition:opacity .7s ease}
#lrfade.on{opacity:1;pointer-events:auto}

/* rocket selection + settings tabs */
.pn.wide{max-width:none;width:min(700px,94vw);box-sizing:border-box}
.tb{display:flex;gap:8px;justify-content:center;margin:10px 0 6px}.tb a{padding:6px 12px;border:1px solid #ffffff33;border-radius:8px;color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.1em}.tb a.on{background:var(--acc);color:#1a1000;border-color:var(--acc)}
.rkh{font-size:11px;letter-spacing:.3em;color:#7fe9ff;margin:8px 0 0}
.rkv{display:flex;align-items:center;gap:4px;margin:6px 0}
.rkw{flex:1;overflow:hidden;position:relative;height:270px;touch-action:pan-y;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.rkt{position:absolute;left:50%;top:6px;display:flex;gap:14px;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.rc{flex:none;width:132px;box-sizing:border-box;opacity:.4;transform:scale(.74);transition:transform .35s,opacity .35s,box-shadow .35s,border-color .35s;cursor:pointer;border:1px solid #ffffff22;border-radius:14px;background:radial-gradient(ellipse at 50% 85%,rgba(95,227,255,.22),rgba(6,14,28,.9) 70%)}
.rc canvas{position:static;inset:auto;display:block;width:132px;height:210px}
.rc b{display:block;font-size:11px;letter-spacing:.12em;padding:6px 0 8px;color:var(--ink)}
.rc.on{opacity:1;transform:scale(1.04);border-color:#7fe9ff;box-shadow:0 0 30px rgba(95,227,255,.45),inset 0 0 20px rgba(95,227,255,.12)}
.rc.sel{border-color:var(--acc);box-shadow:0 0 30px rgba(255,179,71,.55),inset 0 0 20px rgba(255,179,71,.12)}
.rc.sel b::after{content:' ●';color:var(--acc)}
.rka{flex:none;width:40px;height:60px;padding:0;font-size:20px;background:#ffffff14;color:var(--acc);border:1px solid #ffffff33}
#rkn{margin:2px 0 0;font-size:20px;letter-spacing:.18em;background:linear-gradient(180deg,#fff,#7fe9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#rkd{margin:4px 0 8px;min-height:2.6em}
#rkdt{display:flex;gap:6px;justify-content:center;margin:0 0 10px}#rkdt i{width:8px;height:8px;border-radius:50%;background:#ffffff33;cursor:pointer}#rkdt i.on{background:#7fe9ff;box-shadow:0 0 8px #7fe9ff}
#rkc{background:transparent;color:#7fe9ff;border:1px solid #7fe9ff;margin:0 8px 8px 0;padding:10px 18px}#rkc.ok{background:var(--acc);color:#1a1000;border-color:var(--acc)}
#go:disabled{cursor:not-allowed}

/* ===== astronaut profile system ===== */
.prf{--cy:#4de8ff;--bl:#2f7bff;--tx:#e6f4ff;--mu:#93b6dc;--ok:#5cf2a5;--bad:#ff9a8a;position:fixed;inset:0;z-index:60;color:var(--tx);font-family:ui-sans-serif,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;background:radial-gradient(120% 90% at 50% -10%,#0f2f72 0%,#08183c 40%,#030818 100%);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;animation:prf-fade .5s ease both}
.prf[hidden]{display:none!important}
.prf *{box-sizing:border-box}
.prf [hidden]{display:none!important}
.prf.out{animation:prf-out .32s ease both;pointer-events:none}
:where(.prf) button{font:inherit;font-weight:inherit;letter-spacing:normal;background:none;color:inherit;border:0;border-radius:0;padding:0;margin:0;cursor:pointer;filter:none;text-align:inherit}
:where(.prf) button:hover{filter:none}
.prf button:focus-visible,.prf input:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
.prf input{-webkit-user-select:text;user-select:text}
.prf canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
@keyframes prf-fade{from{opacity:0}to{opacity:1}}
@keyframes prf-out{to{opacity:0;transform:scale(1.02)}}

.prf-scroll{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 26px)}
.prf-wrap{margin:auto;width:min(1080px,100%);position:relative}
.prf-head{text-align:center;margin:0 0 20px}
.prf-head h1{margin:0;font-size:clamp(22px,4.4vw,44px);font-weight:800;letter-spacing:.14em;line-height:1.1;background:linear-gradient(180deg,#fff 10%,#8fe9ff 55%,#3aa4ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(77,232,255,.45))}
.prf-head p{margin:10px 0 0;font-size:clamp(13px,2vw,17px);color:var(--mu);letter-spacing:.04em}

.prf-panel{background:linear-gradient(160deg,rgba(22,52,112,.55),rgba(8,20,54,.62));border:1px solid rgba(77,232,255,.3);border-radius:20px;-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);box-shadow:inset 0 1px 0 rgba(160,230,255,.18),0 18px 60px rgba(0,0,0,.45),0 0 44px rgba(47,123,255,.14)}
.prf-main{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.95fr);gap:18px;align-items:stretch}

.prf-tabs{display:flex;gap:6px;padding:12px 14px 0;border-bottom:1px solid rgba(77,232,255,.16)}
.prf-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:11px 6px 13px;color:var(--mu);font-size:13px;letter-spacing:.06em;font-weight:600;position:relative;transition:color .25s}
.prf-tab i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid rgba(147,182,220,.5);transition:all .25s}
.prf-tab::after{content:'';position:absolute;left:12%;right:12%;bottom:-1px;height:2px;border-radius:2px;background:var(--cy);box-shadow:0 0 12px var(--cy);transform:scaleX(0);transition:transform .3s}
.prf-tab.cur{color:#fff}.prf-tab.cur::after{transform:scaleX(1)}
.prf-tab.cur i{border-color:var(--cy);box-shadow:0 0 10px rgba(77,232,255,.6)}
.prf-tab.done i{background:var(--cy);border-color:var(--cy);color:#02142c;font-weight:800}

.prf-stage{padding:24px 26px 6px;min-height:390px;overflow:hidden}
.prf-step{display:none}
.prf-step.on{display:block;animation:prf-in-r .42s cubic-bezier(.2,.8,.2,1) both}
.prf-stage[data-dir=l] .prf-step.on{animation-name:prf-in-l}
@keyframes prf-in-r{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes prf-in-l{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.prf-q{display:block;font-size:19px;font-weight:700;letter-spacing:.05em;margin:0 0 16px;color:#d9f3ff}

.prf-field{position:relative}
.prf-field input{width:100%;height:58px;padding:0 70px 0 20px;font:600 19px/1 ui-sans-serif,"Segoe UI",system-ui,sans-serif;letter-spacing:.06em;color:#fff;background:rgba(3,10,30,.72);border:1px solid rgba(77,232,255,.38);border-radius:14px;caret-color:var(--cy);transition:border-color .2s,box-shadow .2s}
.prf-field input::placeholder{color:#6f8fb8;font-weight:500;letter-spacing:.02em}
.prf-field input:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(77,232,255,.18),0 0 26px rgba(77,232,255,.35)}
#prfCount{position:absolute;right:18px;top:50%;transform:translateY(-50%);font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--mu)}
.prf-hint{margin:12px 2px 0;font-size:13px;line-height:1.5;color:var(--mu);min-height:20px}
.prf-hint.ok{color:var(--ok)}
.prf-field.pop{animation:prf-shake .4s}

.prf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:12px 8px 14px;margin:-6px -8px}
.prf-grid.av{max-width:470px;margin:0 auto;padding:4px 4px 12px}
.prf-av{position:relative;aspect-ratio:1;border-radius:50%;padding:4px;border:2px solid rgba(147,182,220,.28);background:rgba(4,12,34,.55);transition:transform .25s,border-color .25s,box-shadow .25s}
.prf-av img{width:100%;height:100%;display:block;border-radius:50%;pointer-events:none}
.prf-av:hover{transform:translateY(-3px);border-color:rgba(77,232,255,.6)}
.prf-av.on{border-color:var(--cy);box-shadow:0 0 0 2px rgba(77,232,255,.25),0 0 28px rgba(77,232,255,.75),0 0 60px rgba(47,123,255,.4)}
.prf-av.on::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--cy);opacity:0;animation:prf-ring 1.8s ease-out infinite}
.prf-av.pop{animation:prf-pop .45s cubic-bezier(.2,1.4,.4,1)}
.prf-as{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px 10px;border-radius:16px;border:2px solid rgba(147,182,220,.24);background:linear-gradient(180deg,rgba(26,60,124,.38),rgba(5,13,36,.6));transition:transform .25s,border-color .25s,box-shadow .25s}
.prf-as .prf-fig{display:block;height:clamp(118px,19vh,172px);width:100%}
.prf-as img{height:100%;width:100%;object-fit:contain;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5));pointer-events:none}
.prf-as b{font-size:13px;letter-spacing:.1em;margin-top:6px;color:#e6f4ff}
.prf-as small{font-size:10.5px;color:var(--mu);letter-spacing:.03em;text-align:center;line-height:1.3;padding:0 4px}
.prf-as:hover{transform:translateY(-3px);border-color:rgba(77,232,255,.6)}
.prf-as.on{border-color:var(--cy);background:linear-gradient(180deg,rgba(40,100,190,.5),rgba(8,22,56,.7));box-shadow:0 0 28px rgba(77,232,255,.65),0 0 60px rgba(47,123,255,.3),inset 0 0 24px rgba(77,232,255,.14)}
.prf-as.pop{animation:prf-pop .45s cubic-bezier(.2,1.4,.4,1)}
.prf-as.on .prf-fig img{animation:prf-bob 2.4s ease-in-out infinite}
.prf-tag{display:none;position:absolute;font-style:normal;font:800 9px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;color:#02142c;background:var(--cy);padding:4px 8px;border-radius:20px;box-shadow:0 0 12px rgba(77,232,255,.8);white-space:nowrap;z-index:2}
.prf-av .prf-tag{left:50%;bottom:-9px;transform:translateX(-50%)}
.prf-as .prf-tag{top:-9px;left:50%;transform:translateX(-50%)}
.prf-av.on .prf-tag,.prf-as.on .prf-tag{display:block;animation:prf-tagin .35s ease both}
@keyframes prf-pop{0%{transform:scale(.92)}55%{transform:scale(1.08)}100%{transform:scale(1.03)}}
@keyframes prf-ring{0%{transform:scale(.96);opacity:.8}100%{transform:scale(1.16);opacity:0}}
@keyframes prf-tagin{from{opacity:0;margin-top:6px}to{opacity:1;margin-top:0}}
@keyframes prf-bob{50%{transform:translateY(-5px)}}
@keyframes prf-shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.prf-av.on,.prf-as.on{transform:scale(1.03)}

.prf-nav{display:flex;justify-content:space-between;padding:14px 22px 20px}
.prf-btn{padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;letter-spacing:.08em;color:#02142c;background:linear-gradient(180deg,#7ceeff,#3fb4ff);box-shadow:0 0 16px rgba(77,232,255,.35);transition:transform .15s,box-shadow .2s}
.prf-btn:hover{transform:translateY(-1px);box-shadow:0 0 24px rgba(77,232,255,.6)}
.prf-btn.ghost{background:transparent;color:var(--mu);box-shadow:none;border:1px solid rgba(147,182,220,.35)}
.prf-btn.ghost:hover{color:#fff;border-color:var(--cy);box-shadow:none}

/* live preview card */
.prf-prev{padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px;overflow:hidden;position:relative}
.prf-prev::before{content:'';position:absolute;left:0;right:0;height:80px;top:-80px;background:linear-gradient(180deg,transparent,rgba(77,232,255,.1),transparent);animation:prf-scan 6s linear infinite;pointer-events:none}
@keyframes prf-scan{to{top:105%}}
.pv-top{display:flex;justify-content:space-between;align-items:center;font:700 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:#a9dcff;padding-bottom:12px;border-bottom:1px dashed rgba(77,232,255,.25)}
.pv-live{font-size:10px;color:var(--ok);display:flex;align-items:center;gap:6px;letter-spacing:.14em}
.pv-live i,.pv-info dd.ok i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:prf-blink 1.4s ease-in-out infinite;display:inline-block}
@keyframes prf-blink{50%{opacity:.35}}
.pv-id{display:flex;align-items:center;gap:16px}
.pv-av{position:relative;flex:none;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;border:2px dashed rgba(147,182,220,.4);background:rgba(4,12,34,.5)}
.pv-av.has{border:2px solid var(--cy);box-shadow:0 0 0 4px rgba(77,232,255,.12),0 0 28px rgba(77,232,255,.6);padding:3px}
.pv-av img{width:100%;height:100%;border-radius:50%;display:block}
.pv-ph{font-size:34px;color:rgba(147,182,220,.55);font-weight:300}.has .pv-ph{display:none}
.pv-info{min-width:0;flex:1}
.pv-name{font-size:clamp(19px,2.4vw,25px);font-weight:800;letter-spacing:.08em;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 16px rgba(77,232,255,.5)}
.pv-name.empty{color:#58739a;text-shadow:none;font-weight:600}
.pv-info dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px;align-items:center}
.pv-info dt{color:var(--mu);letter-spacing:.06em}
.pv-info dd{margin:0;font:700 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:#ffd27a}
.pv-info dd.ok{color:var(--ok);display:flex;align-items:center;gap:7px}
.pv-fig{position:relative;flex:1;min-height:230px;display:flex;align-items:flex-end;justify-content:center;border-radius:14px;background:radial-gradient(ellipse 60% 22% at 50% 92%,rgba(77,232,255,.45),transparent 70%),linear-gradient(180deg,rgba(4,12,34,.2),rgba(4,12,34,.55));border:1px solid rgba(77,232,255,.15);padding:14px 0 12px}
.pv-fig::after{content:'';position:absolute;left:22%;right:22%;bottom:8px;height:12px;border-radius:50%;border:1px solid rgba(77,232,255,.55);box-shadow:0 0 14px rgba(77,232,255,.6);transform:scaleY(.8)}
.pv-fig img{position:relative;z-index:1;height:min(250px,100%);max-height:250px;width:auto;max-width:90%;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(0,0,0,.55));animation:prf-bob 3.2s ease-in-out infinite}
.pv-ph2{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:#58739a;letter-spacing:.06em}.pv-fig.has .pv-ph2{display:none}
.pv-fig img.swap,.pv-av img.swap{animation:prf-swap .45s cubic-bezier(.2,.9,.3,1.2) both,prf-bob 3.2s ease-in-out .45s infinite}
.pv-av img.swap{animation:prf-swap .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes prf-swap{from{opacity:0;transform:scale(.7) translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* confirm */
.prf-foot{margin-top:22px;text-align:center}
.prf-msg{min-height:22px;margin:0 0 12px;font-size:14px;color:transparent;line-height:1.5}
.prf-msg.show{color:var(--bad);animation:prf-shake .45s}
.prf-go{position:relative;display:block;width:min(580px,100%);margin:0 auto;padding:21px 28px;border-radius:18px;font-size:clamp(14px,2.2vw,19px);font-weight:800;letter-spacing:.18em;color:#021024;background:linear-gradient(100deg,#4de8ff,#2f7bff 50%,#4de8ff);background-size:220% 100%;box-shadow:0 0 0 1px rgba(160,240,255,.5),0 0 28px rgba(77,232,255,.65),0 0 80px rgba(47,123,255,.4);animation:prf-sheen 3.2s linear infinite;transition:transform .15s,filter .2s}
.prf button.prf-go:hover{filter:brightness(1.12);transform:translateY(-2px)}
.prf button.prf-go:active{transform:scale(.98)}
.prf-go.dim{filter:saturate(.5) brightness(.75);box-shadow:0 0 0 1px rgba(160,240,255,.2),0 0 14px rgba(77,232,255,.2);animation:none}
.prf button.prf-go.dim:hover{filter:saturate(.6) brightness(.9)}
.prf-go.shake{animation:prf-shake .45s}
@keyframes prf-sheen{to{background-position:-220% 0}}
.prf-cancel{display:block;margin:16px auto 0;font-size:13px;color:var(--mu);text-decoration:underline;text-underline-offset:4px;padding:8px}
.prf button.prf-cancel:hover{color:#fff}

/* welcome cinematic */
.prf-wel{z-index:70;background:#030818;animation:prf-fade .6s ease both}
.prf-wel.out{animation:prf-out .9s ease both}
.wel-core{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.wel-ring{width:clamp(96px,16vh,150px);aspect-ratio:1;border-radius:50%;padding:4px;border:2px solid var(--cy);box-shadow:0 0 40px rgba(77,232,255,.8),0 0 120px rgba(47,123,255,.5);animation:wel-ring 1s cubic-bezier(.2,1.3,.4,1) .15s both}
.wel-ring img{width:100%;height:100%;border-radius:50%;display:block}
@keyframes wel-ring{from{opacity:0;transform:scale(.3) rotate(-120deg)}to{opacity:1;transform:none}}
.wel-l1{margin-top:8px;font-size:clamp(14px,2.6vw,24px);font-weight:700;letter-spacing:.5em;color:#9fe6ff;padding-left:.5em;animation:wel-l1 1s ease .7s both}
@keyframes wel-l1{from{opacity:0;letter-spacing:1em}to{opacity:1;letter-spacing:.5em}}
.wel-l2{font-size:clamp(24px,6.4vw,64px);font-weight:900;letter-spacing:.08em;line-height:1.15;color:#fff;max-width:96vw;overflow-wrap:anywhere;text-shadow:0 0 30px rgba(77,232,255,.9),0 0 80px rgba(47,123,255,.7);animation:wel-l2 .9s cubic-bezier(.2,1.2,.4,1) 1.2s both}
.wel-l2 b{background:linear-gradient(180deg,#fff,#6fe6ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
@keyframes wel-l2{from{opacity:0;transform:scale(1.5);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}
.wel-fig{height:clamp(110px,24vh,230px);width:auto;margin-top:6px;filter:drop-shadow(0 0 24px rgba(77,232,255,.45));animation:wel-fig 1s cubic-bezier(.2,.9,.3,1) 1.7s both,prf-bob 3s ease-in-out 2.7s infinite}
@keyframes wel-fig{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
.wel-bar{width:min(340px,70vw);height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:10px;animation:prf-fade .5s ease 1.8s both}
.wel-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bl),var(--cy));box-shadow:0 0 12px var(--cy);transform-origin:left;animation:wel-bar 2.5s linear 1.8s both}
@keyframes wel-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.wel-sub{font:11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.24em;color:#7fb6dc;animation:prf-fade .5s ease 1.9s both}

/* profile inside the existing game */
.prf-hud{display:flex;align-items:center;gap:9px;margin:0 0 9px;padding:0 0 9px;border-bottom:1px solid #ffffff1f}
.prf-hud img{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px #4de8ff,0 0 10px rgba(77,232,255,.55)}
.prf-hud b{display:block;font-size:12px;letter-spacing:.1em;max-width:138px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prf-hud span{display:block;font-size:9.5px;letter-spacing:.14em;color:#8fd8ff;margin-top:2px}
.prf-card{display:flex;align-items:center;gap:14px;text-align:left;margin:0 0 16px;padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(47,123,255,.18),rgba(77,232,255,.06));border:1px solid rgba(77,232,255,.32);box-shadow:inset 0 0 24px rgba(77,232,255,.07)}
.prf-card .c-av{width:58px;height:58px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #4de8ff,0 0 16px rgba(77,232,255,.55)}
.prf-card .c-t{flex:1;min-width:0}
.prf-card .c-t b{display:block;font-size:15px;letter-spacing:.1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#eaf8ff}
.prf-card .c-t span{display:block;font-size:10.5px;letter-spacing:.14em;color:#8fd8ff;margin-top:4px;line-height:1.4}
.prf-card .c-t .c-s{color:#cfe9ff;letter-spacing:.04em;font-size:11.5px;white-space:normal}
.prf-card .c-fig{height:96px;width:auto;flex:none;margin:-8px 0 -10px;filter:drop-shadow(0 6px 10px #000a)}
.pn .prf-card .c-edit{flex:none;font:700 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;padding:9px 12px;border-radius:9px;background:transparent;color:#7fe9ff;border:1px solid #7fe9ff;white-space:nowrap}
.pn .prf-card .c-edit:hover{background:rgba(77,232,255,.16);filter:none}
.prf-small{padding:8px 12px}.prf-small .c-av{width:36px;height:36px}
.prf-fail .c-av{box-shadow:0 0 0 2px #ff9a8a,0 0 14px rgba(255,138,122,.45)}
.prf-win{border-color:rgba(92,242,165,.5);background:linear-gradient(135deg,rgba(92,242,165,.16),rgba(77,232,255,.06))}
.prf-win .c-av{box-shadow:0 0 0 2px #5cf2a5,0 0 18px rgba(92,242,165,.6)}

@media (max-width:900px){
 .prf-main{grid-template-columns:1fr}
 .prf-prev{order:-1;padding:12px 14px;gap:10px;flex-direction:row;flex-wrap:wrap;align-items:center}
 .prf-prev .pv-top{display:none}
 .prf-prev .pv-id{flex:1;min-width:0;gap:12px}
 .pv-av{width:68px;height:68px}
 .pv-fig{flex:none;min-height:0;width:104px;height:122px;padding:6px 0 8px}
 .pv-fig img{max-height:108px}
 .pv-fig::after{bottom:4px}
 .pv-info dl{margin-top:6px;gap:4px 10px;font-size:11px}
 .pv-info dd{font-size:10.5px}
 .prf-stage{min-height:360px;padding:20px 16px 4px}
 .prf-grid{gap:12px}
 .prf-as .prf-fig{height:clamp(104px,16vh,140px)}
}
@media (max-width:520px){
 .prf-scroll{padding-left:12px;padding-right:12px}
 .prf-head{margin-bottom:14px}
 .prf-tab{font-size:12px;gap:6px}.prf-tab i{width:21px;height:21px}
 .prf-as b{font-size:12px;letter-spacing:.06em}.prf-as small{display:none}
 .prf-as{padding:10px 4px 8px}
 .prf-card .c-fig{height:78px}
 .prf-card .c-av{width:48px;height:48px}
 .pn .prf-card{flex-wrap:wrap}
}
@media (max-height:560px) and (orientation:landscape){
 .prf-head{margin-bottom:10px}.prf-head p{display:none}
 .prf-card .c-fig{display:none}
}
@media (max-width:520px){.prf-field input{font-size:17px;padding-right:56px}.prf-field input::placeholder{font-size:15px}}
@media (prefers-reduced-motion:reduce){
 .prf *,.prf-card *{animation:none!important;transition:none!important}
}
#gZ{margin-top:7px}#bZ{background:#6fd3ff}#bZ.hi{background:#ff5d5d}#sZ{font-size:9px;letter-spacing:.14em;opacity:.9;margin-top:2px;color:#9fe3ff}
#frost{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(ellipse at center,rgba(150,215,255,0) 35%,rgba(170,225,255,.5) 75%,rgba(235,248,255,.85) 100%);box-shadow:inset 0 0 90px 30px rgba(120,200,255,.55)}
#cold{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .8s;background:linear-gradient(rgba(30,110,255,.20),rgba(120,210,255,.14));mix-blend-mode:screen}
#tags{position:fixed;left:50%;top:86px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:6;pointer-events:none}
.tg{font-size:10px;letter-spacing:.18em;padding:3px 10px;border:1px solid currentColor;border-radius:4px;background:var(--pn);text-shadow:0 0 8px currentColor;box-shadow:0 0 10px -2px currentColor;animation:tgA 2.6s ease forwards;white-space:nowrap}
.tg.b{color:#7fe3ff}.tg.o{color:#ffb347}.tg.r{color:#ff6060}.tg.w{color:#fff}
@keyframes tgA{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#endt{position:fixed;inset:0;z-index:7;display:none;pointer-events:none;color:#dff6ff;font-family:ui-monospace,Menlo,Consolas,monospace}
#ets{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 5vw}
#esk{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);pointer-events:auto;background:#06122499;color:#cfe;border:1px solid #fff4;padding:7px 12px;font-size:10px}
.e1{font-size:clamp(22px,6.4vw,58px);font-weight:900;letter-spacing:.16em;color:#5cf2a5;text-shadow:0 0 18px #5cf2a5,0 0 50px #1a9;animation:eF 1.6s ease both}
.e2{position:absolute;bottom:14%;font-size:clamp(13px,3.4vw,28px);letter-spacing:.2em;text-shadow:0 0 14px #7fe3ff;animation:eF 1.6s .4s ease both}.e2.w{color:#ffd9a0;text-shadow:0 0 16px #ffb347}
.eT{font-size:clamp(54px,17vw,170px);font-weight:900;letter-spacing:.2em;padding-left:.2em;color:#fff;animation:eT 4.5s ease both,eG 3s 4.5s ease-in-out infinite}
.eS{margin-top:14px;font-size:clamp(14px,3.6vw,28px);letter-spacing:.5em;color:#ffb347;animation:eF 2s 2.6s ease both}.eS2{margin-top:6px;font-size:clamp(9px,2.2vw,14px);letter-spacing:.34em;opacity:.8;animation:eF 2s 3.2s ease both}
.eS3{margin-top:22px;font-size:clamp(10px,2.4vw,15px);letter-spacing:.3em;color:#5cf2a5;animation:eF 2s 4s ease both}.eB{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;pointer-events:auto;animation:eF 1.6s 5s ease both}

/* ---------- level ---------- */
function flat(p){p.y=T[Math.round(p.x/ST)];for(let i=0;i<N;i++){const d=Math.abs(i*ST-p.x),h=p.w/2;if(d<=h)T[i]=p.y;else if(d<h+80){const t=(d-h)/80,s=t*t*(3-2*t);T[i]=p.y+(T[i]-p.y)*s}}}

function setup(l){

/* ---------- physics ---------- */
function collide(){
 const s=Math.sin(L.a),c=Math.cos(L.a),pt=(lx,ly)=>[L.x+lx*c-ly*s,L.y+lx*s+ly*c];
 for(const[lx,ly]of[[0,-20],[-18,-4],[18,-4]]){const[px,py]=pt(lx,ly);if(py>gy(px))return boom('Hull struck the terrain')}
 for(const lx of[-22,22]){const[px,py]=pt(lx,23);if(py>=gy(px))return touch()}
}
function touch(){
 const sp=L.vy,hs=Math.abs(L.vx),an=Math.abs(Math.atan2(Math.sin(L.a),Math.cos(L.a))),sl=Math.abs(gy(L.x-22)-gy(L.x+22));
 if(sp>200||an>.95||hs>160||sl>44)return boom(sp>200?'Descent was too fast':an>.95?'Lander tipped over':hs>160?'Too much sideways speed':'Slope too steep');
 if(sp>110*D.tol||an>.55*D.tol||hs>85*D.tol||sl>26){L.hull-=15;shake=10;beep(120,.3,'square',.1);if(L.hull<=0)return boom('Hull integrity lost')}
 else beep(520,.08,'triangle');
 L.landed=true;L.vx=L.vy=L.w=0;L.a=0;L.y=Math.min(gy(L.x-22),gy(L.x+22))-23;
 dust(L.x,gy(L.x),34,220);sq=Math.min(1,sp/90+.25);
}
function upd(dt){

  if(th){L.fuel=Math.max(0,L.fuel-3*dt*[.8,1,1.25,1.5][df]);if(L.landed){L.landed=false;L.vy=-6}

   const nx=L.x-16*Math.sin(L.a),ny=L.y+16*Math.cos(L.a);
   for(let i=0;i<3;i++)P(nx,ny,-Math.sin(L.a)*220+(Math.random()-.5)*70+L.vx*.3,Math.cos(L.a)*220+(Math.random()-.5)*70+L.vy*.3,.25+Math.random()*.25,2+Math.random()*3,Math.random()<.5?'#ffb347':'#ffe9a8',true);
   const h=gy(L.x)-L.y;if(h<150&&Math.random()<.9)dust(L.x+(Math.random()-.5)*30,gy(L.x),2,260)}
  if(!L.landed){L.vy+=G*(zones.some(z=>Math.abs(L.x-z.x)<z.w/2)?1.7:1)*dt;L.x+=L.vx*dt;L.y+=L.vy*dt;collide()}

/* ---------- storage ---------- */
function read(){
 try{
  const p=JSON.parse(localStorage.getItem(KEY));
  if(p&&p.created===true&&okName(p.name)&&AV.some(a=>a.id===p.avatar)&&AS.some(a=>a.id===p.astronaut))
   return{name:clean(p.name),avatar:p.avatar,astronaut:p.astronaut,created:true,createdAt:p.createdAt||Date.now(),updatedAt:p.updatedAt||0};
 }catch(e){}
 return null;
}
function write(p){try{localStorage.setItem(KEY,JSON.stringify(p));return true}catch(e){return false}}

const LRP=window.LRP={
 get profile(){return cur},
 get name(){return cur?cur.name:'Player'},
 badge:()=>cur?avOf(cur).src:'',
 astro:()=>cur?asOf(cur).src:'',
 badgeImg:()=>badgeEl,
 decorate:h=>decorate(h),
 edit:()=>openEditor(),
 tick:()=>tick()
};

/* ---------- build the registration screen ---------- */
function build(){
 if($('prfRoot'))return;
 const r=D.createElement('div');r.id='prfRoot';r.className='prf';r.hidden=true;
 r.setAttribute('role','dialog');r.setAttribute('aria-modal','true');r.setAttribute('aria-labelledby','prfTitle');
 const avBtns=AV.map((a,i)=>`<button type="button" class="prf-av" role="radio" aria-checked="false" data-i="${i+1}" aria-label="Avatar ${i+1}: ${a.n}"><img src="${a.src}" alt="" draggable="false"><em class="prf-tag">SELECTED</em></button>`).join('');
 const asBtns=AS.map((a,i)=>`<button type="button" class="prf-as" role="radio" aria-checked="false" data-i="${i+1}" aria-label="Astronaut ${i+1}: ${a.n}, ${a.d}"><em class="prf-tag">SELECTED</em><span class="prf-fig"><img src="${a.src}" alt="" draggable="false"></span><b>${a.n}</b><small>${a.d}</small></button>`).join('');
 r.innerHTML=`
<canvas id="prfStars" aria-hidden="true"></canvas>
<div class="prf-scroll"><div class="prf-wrap">
 <header class="prf-head">
  <h1 id="prfTitle">CREATE YOUR ASTRONAUT PROFILE</h1>
  <p id="prfSub">Every great space mission starts with an astronaut.</p>
 </header>
 <div class="prf-main">
  <section class="prf-panel prf-form" aria-label="Profile builder">
   <div class="prf-tabs" role="tablist">
    <button type="button" role="tab" class="prf-tab" id="prfT0" data-s="0" aria-controls="prfS0"><i>1</i><span>Name</span></button>
    <button type="button" role="tab" class="prf-tab" id="prfT1" data-s="1" aria-controls="prfS1"><i>2</i><span>Avatar</span></button>
    <button type="button" role="tab" class="prf-tab" id="prfT2" data-s="2" aria-controls="prfS2"><i>3</i><span>Astronaut</span></button>
   </div>
   <div class="prf-stage" id="prfStage" data-dir="r">
    <div class="prf-step" id="prfS0" role="tabpanel" aria-labelledby="prfT0">
     <label class="prf-q" for="prfName">Enter Your Name</label>
     <div class="prf-field"><input id="prfName" type="text" maxlength="18" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Enter your astronaut name..." aria-describedby="prfHint"><span id="prfCount" aria-hidden="true">0/18</span></div>
     <p class="prf-hint" id="prfHint">Between 3 and 18 characters. This is the callsign mission control will use.</p>
    </div>
    <div class="prf-step" id="prfS1" role="tabpanel" aria-labelledby="prfT1">
     <div class="prf-q" id="prfQ1">Choose Your Avatar</div>
     <div class="prf-grid av" role="radiogroup" aria-labelledby="prfQ1">${avBtns}</div>
    </div>
    <div class="prf-step" id="prfS2" role="tabpanel" aria-labelledby="prfT2">
     <div class="prf-q" id="prfQ2">Choose Your Astronaut</div>
     <div class="prf-grid as" role="radiogroup" aria-labelledby="prfQ2">${asBtns}</div>
    </div>
   </div>
   <div class="prf-nav">
    <button type="button" class="prf-btn ghost" id="prfBack">&#9664; Back</button>
    <button type="button" class="prf-btn" id="prfNext">Next &#9654;</button>
   </div>
  </section>
  <aside class="prf-panel prf-prev" aria-label="Live profile preview">
   <div class="pv-top"><span>ASTRONAUT ID</span><span class="pv-live"><i></i>LIVE PREVIEW</span></div>
   <div class="pv-id">
    <div class="pv-av" id="pvAv"><span class="pv-ph">?</span></div>
    <div class="pv-info">
     <div class="pv-name empty" id="pvName">YOUR NAME</div>
     <dl><dt>Rank</dt><dd id="pvRank">CADET</dd><dt>Status</dt><dd class="ok"><i></i>READY FOR MISSION</dd></dl>
    </div>
   </div>
   <div class="pv-fig" id="pvFig"><span class="pv-ph2">Pick an astronaut</span></div>
  </aside>
 </div>
 <footer class="prf-foot">
  <p id="prfMsg" class="prf-msg" role="alert" aria-live="assertive"></p>
  <button type="button" id="prfGo" class="prf-go dim"><span>CREATE PROFILE &amp; CONTINUE</span></button>
  <button type="button" id="prfCancel" class="prf-cancel" hidden>Cancel and keep my current profile</button>
 </footer>
</div></div>`;
 D.body.appendChild(r);
 wire(r);
}

/* ---------- starfield ---------- */
let skyOn=false,skyRaf=0;
function skyStart(){
 const cv=$('prfStars');if(!cv||skyOn)return;
 const x=cv.getContext('2d');let w=0,h=0,dpr=1;
 const fit=()=>{dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)};
 fit();addEventListener('resize',fit);
 const st=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.5+.3,p:Math.random()*6.28,v:Math.random()*.6+.2}));
 const du=Array.from({length:26},()=>({x:Math.random(),y:Math.random(),r:Math.random()*2.2+.8,vx:(Math.random()-.5)*.012,vy:-Math.random()*.02-.006,a:Math.random()*.4+.15}));
 skyOn=true;
 const frame=t=>{
  if(!skyOn){removeEventListener('resize',fit);return}
  x.clearRect(0,0,w,h);
  for(const s of st){const a=.35+.65*(.5+.5*Math.sin(t/900*s.v+s.p));x.globalAlpha=a;x.fillStyle=s.s>1.4?'#bfeaff':'#fff';x.beginPath();x.arc(s.x*w,s.y*h,s.s,0,7);x.fill()}
  for(const d of du){d.x+=d.vx*.016;d.y+=d.vy*.016;if(d.y<-.05){d.y=1.05;d.x=Math.random()}if(d.x<-.05)d.x=1.05;if(d.x>1.05)d.x=-.05;
   const g=x.createRadialGradient(d.x*w,d.y*h,0,d.x*w,d.y*h,d.r*5);g.addColorStop(0,'rgba(77,232,255,'+d.a+')');g.addColorStop(1,'rgba(77,232,255,0)');x.globalAlpha=1;x.fillStyle=g;x.beginPath();x.arc(d.x*w,d.y*h,d.r*5,0,7);x.fill()}
  x.globalAlpha=1;
  if(reduce()){skyOn=false;return}
  skyRaf=requestAnimationFrame(frame);
 };
 frame(0);
}
function skyStop(){skyOn=false;cancelAnimationFrame(skyRaf)}

/* ---------- screen logic ---------- */
function setImg(host,src,cls,key){
 const old=host.querySelector('img');
 if(!src){if(old)old.remove();host.dataset.k='';host.classList.remove('has');return}
 if(host.dataset.k===key)return;
 host.dataset.k=key;if(old)old.remove();
 const i=new Image();i.src=src;i.alt='';i.draggable=false;i.className=cls+' swap';host.appendChild(i);host.classList.add('has');
}
function paint(){
 const n=clean(draft.name),nm=$('pvName');
 nm.textContent=n||'YOUR NAME';nm.classList.toggle('empty',!n);
 setImg($('pvAv'),draft.av?AV[draft.av-1].src:'','pv-avimg','a'+draft.av);
 setImg($('pvFig'),draft.as?AS[draft.as-1].src:'','pv-figimg','s'+draft.as);
 D.querySelectorAll('#prfRoot .prf-av').forEach(b=>{const on=+b.dataset.i===draft.av;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
 D.querySelectorAll('#prfRoot .prf-as').forEach(b=>{const on=+b.dataset.i===draft.as;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
 const done=[okName(draft.name),!!draft.av,!!draft.as];
 done.forEach((d,i)=>{const t=$('prfT'+i);t.classList.toggle('done',d);t.firstChild.textContent=d?'\u2713':String(i+1)});
 $('prfGo').classList.toggle('dim',!done.every(Boolean));
 const c=clean(draft.name).length;$('prfCount').textContent=(draft.name.length)+'/18';
 const hint=$('prfHint');
 if(!draft.name)hint.textContent='Between 3 and 18 characters. This is the callsign mission control will use.';
 else if(c<3)hint.textContent='A little longer, astronaut. At least 3 characters.';
 else hint.textContent='Callsign accepted. Mission control copies you loud and clear.';
 hint.classList.toggle('ok',c>=3);
}
function go(i){
 const dir=i>=step?'r':'l';step=i;$('prfStage').dataset.dir=dir;
 for(let k=0;k<3;k++){
  const s=$('prfS'+k),on=k===i;s.classList.remove('on');if(on){void s.offsetWidth;s.classList.add('on')}
  const t=$('prfT'+k);t.classList.toggle('cur',on);t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1;
 }
 $('prfBack').style.visibility=i===0?'hidden':'visible';
 $('prfNext').style.visibility=i===2?'hidden':'visible';
}
function msg(t,kind){const m=$('prfMsg');m.textContent=t||'';m.className='prf-msg'+(t?' show '+(kind||'bad'):'');if(t){m.style.animation='none';void m.offsetWidth;m.style.animation=''}}
function missing(){const a=[];if(!okName(draft.name))a.push([0,'a name (3 to 18 characters)']);if(!draft.av)a.push([1,'an avatar']);if(!draft.as)a.push([2,'an astronaut']);return a}
function pop(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}

function wire(r){
 const name=$('prfName');
 name.addEventListener('input',()=>{draft.name=name.value;msg('');paint()});
 name.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(okName(draft.name)){go(1);msg('')}else{msg('Enter a name between 3 and 18 characters.');pop($('prfS0').querySelector('.prf-field'))}}});
 r.querySelectorAll('.prf-av').forEach(b=>b.addEventListener('click',()=>{draft.av=+b.dataset.i;msg('');paint();pop(b);beep(660+draft.av*40)}));
 r.querySelectorAll('.prf-as').forEach(b=>b.addEventListener('click',()=>{draft.as=+b.dataset.i;msg('');paint();pop(b);beep(520+draft.as*45)}));
 r.querySelectorAll('.prf-tab').forEach(t=>t.addEventListener('click',()=>go(+t.dataset.s)));
 $('prfBack').addEventListener('click',()=>go(Math.max(0,step-1)));
 $('prfNext').addEventListener('click',()=>go(Math.min(2,step+1)));
 $('prfGo').addEventListener('click',submit);
 $('prfCancel').addEventListener('click',closeEditor);
 r.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&mode==='edit'){e.preventDefault();closeEditor();return}
  if(e.key==='Tab'){
   const f=[...r.querySelectorAll('button,input')].filter(n=>!n.disabled&&n.offsetParent!==null&&n.tabIndex>=0);
   if(!f.length)return;const a=f[0],z=f[f.length-1];
   if(e.shiftKey&&D.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&D.activeElement===z){e.preventDefault();a.focus()}
  }
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.classList&&e.target.classList.contains('prf-tab')){
   const n=Math.max(0,Math.min(2,+e.target.dataset.s+(e.key==='ArrowRight'?1:-1)));go(n);$('prfT'+n).focus()}
 });
}

function submit(){
 const m=missing();
 if(m.length){
  msg('Mission control cannot register you yet. Still needed: '+m.map(x=>x[1]).join(', ')+'.');
  go(m[0][0]);
  if(m[0][0]===0)setTimeout(()=>$('prfName').focus(),60);
  const t=$('prfGo');t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');beep(180,.18,'square');
  return;
 }
 const now=Date.now();
 const p={name:clean(draft.name),avatar:AV[draft.av-1].id,astronaut:AS[draft.as-1].id,created:true,createdAt:(cur&&cur.createdAt)||now,updatedAt:now};
 cur=p;write(p);refreshAll();
 if(mode==='edit'){closeEditor(true);try{G().toast&&G().toast('PROFILE UPDATED · '+p.name.toUpperCase())}catch(e){}}
 else welcome();
}

/* ---------- open / close ---------- */
function load(p){draft={name:p?p.name:'',av:p?AV.findIndex(a=>a.id===p.avatar)+1:0,as:p?AS.findIndex(a=>a.id===p.astronaut)+1:0}}
function show(m){
 build();mode=m;const r=$('prfRoot');
 load(m==='edit'?cur:null);
 $('prfName').value=draft.name;
 $('prfTitle').textContent=m==='edit'?'EDIT YOUR ASTRONAUT PROFILE':'CREATE YOUR ASTRONAUT PROFILE';
 $('prfSub').textContent=m==='edit'?'Change your name, avatar or astronaut. Your coins, XP, level and upgrades stay exactly as they are.':'Every great space mission starts with an astronaut.';
 $('prfGo').firstChild.textContent=m==='edit'?'SAVE CHANGES':'CREATE PROFILE & CONTINUE';
 $('prfCancel').hidden=m!=='edit';
 $('pvRank').textContent=m==='edit'?rankText().split(' \u00b7 ')[0]:'CADET';
 msg('');paint();go(0);
 r.classList.remove('out');r.hidden=false;
 r.querySelector('.prf-scroll').scrollTop=0;
 skyStart();
 setTimeout(()=>{try{$('prfName').focus({preventScroll:true})}catch(e){}},m==='edit'?120:350);
}
function openEditor(){opener=D.activeElement;show('edit')}
function closeEditor(saved){
 const r=$('prfRoot');if(!r||r.hidden)return;
 r.classList.add('out');
 setTimeout(()=>{r.hidden=true;r.classList.remove('out');skyStop();try{opener&&opener.isConnected&&opener.focus({preventScroll:true})}catch(e){}},reduce()?0:320);
}

/* ---------- welcome cinematic ---------- */
function welcome(){
 const w=D.createElement('div');w.id='prfWel';w.className='prf prf-wel';w.setAttribute('role','status');
 const nm=cur.name.toUpperCase();
 w.setAttribute('aria-label','Welcome aboard, Commander '+nm+'!');
 w.innerHTML=`<canvas id="prfWarp" aria-hidden="true"></canvas>
 <div class="wel-core">
  <div class="wel-ring"><img src="${avOf(cur).src}" alt=""></div>
  <div class="wel-l1">WELCOME ABOARD,</div>
  <div class="wel-l2"><span>COMMANDER</span> <b id="welName"></b><span>!</span></div>
  <img class="wel-fig" src="${asOf(cur).src}" alt="">
  <div class="wel-bar"><i></i></div>
  <div class="wel-sub">Preparing your mission briefing</div>
 </div>`;
 D.body.appendChild(w);$('welName').textContent=nm;
 // warp-speed starfield
 const cv=$('prfWarp'),x=cv.getContext('2d');let W,H,raf=0,live=true;
 const fit=()=>{const d=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0)};fit();addEventListener('resize',fit);
 const S=Array.from({length:160},()=>({a:Math.random()*6.283,r:Math.random(),v:.15+Math.random()*.5}));
 const t0=performance.now();
 const fr=t=>{if(!live)return;const e=(t-t0)/1000,sp=Math.min(1,e/1.4)*(1-Math.max(0,(e-2.6)/1.2)*.7);
  x.fillStyle='rgba(3,8,24,.32)';x.fillRect(0,0,W,H);const cx=W/2,cy=H/2,R=Math.hypot(W,H)/2;
  for(const s of S){const r0=s.r;s.r+=s.v*.012*(.3+sp*3.2);if(s.r>1){s.r=Math.random()*.05;s.a=Math.random()*6.283}
   const a=Math.cos(s.a),b=Math.sin(s.a),r1=s.r*R,r2=Math.max(0,s.r-(.012+sp*.09)*s.v*3)*R;
   x.strokeStyle='rgba('+(160+95*s.r|0)+',235,255,'+(.15+.8*s.r)+')';x.lineWidth=.6+s.r*1.8;x.beginPath();x.moveTo(cx+a*r2,cy+b*r2);x.lineTo(cx+a*r1,cy+b*r1);x.stroke()}
  raf=requestAnimationFrame(fr)};
 if(reduce()){x.fillStyle='#030818';x.fillRect(0,0,W,H)}else{x.fillStyle='#030818';x.fillRect(0,0,W,H);raf=requestAnimationFrame(fr)}
 [440,554,659,880].forEach((f,i)=>setTimeout(()=>beep(f,.3,'triangle',.05),500+i*160));
 let done=false;
 const finish=()=>{
  if(done)return;done=true;
  removeEventListener('keydown',key);w.removeEventListener('pointerdown',finish);
  const r=$('prfRoot');if(r){r.hidden=true;skyStop()}
  startGame();
  w.classList.add('out');
  setTimeout(()=>{live=false;cancelAnimationFrame(raf);removeEventListener('resize',fit);w.remove()},reduce()?0:900);
 };
 const key=e=>{if(['Enter',' ','Escape'].includes(e.key)){e.preventDefault();finish()}};
 addEventListener('keydown',key);w.addEventListener('pointerdown',finish);
 setTimeout(finish,reduce()?1800:4300);
}
function beep(f,d=.1,t='sine',v=.04){try{const g=G();if(g.aud)g.aud();const ac=g.ac&&g.ac();if(!ac)return;const o=ac.createOscillator(),n=ac.createGain();o.type=t;o.frequency.value=f;n.gain.setValueAtTime(v,ac.currentTime);n.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(n);n.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

/* ---------- hand over to the existing game ---------- */
function startGame(){
 if(started)return;started=true;
 try{window.LR_IMG=Object.assign(window.LR_IMG||{},{astro:asOf(cur).src})}catch(e){}
 if(typeof window.LR_RUN_INTRO==='function')window.LR_RUN_INTRO();
 else if(G().menu)G().menu();
}

/* ---------- show the profile inside the existing game ---------- */
function refreshImgs(){
 if(!cur)return;
 badgeEl=new Image();badgeEl.src=avOf(cur).src;
 const pre=new Image();pre.src=asOf(cur).src;
}
let hudRk=null;
function buildHud(){
 const h=$('hud');if(!h||$('prfHud'))return;
 const d=D.createElement('div');d.id='prfHud';d.className='prf-hud';
 d.innerHTML='<img alt="" width="34" height="34"><div><b></b><span></span></div>';
 h.insertBefore(d,h.firstChild);hudRk=d.querySelector('span');
}
function rankText(){let r='CADET',l=1;try{const g=G();if(g.rank)r=String(g.rank()).toUpperCase();if(g.PF)l=g.PF.lv}catch(e){}return r+' \u00b7 LV '+l}
function paintHud(){
 buildHud();const d=$('prfHud');if(!d||!cur)return;
 d.querySelector('img').src=avOf(cur).src;d.querySelector('b').textContent=cur.name;d.title=cur.name;
 hudRk.textContent=rankText();
}
function tick(){if(!hudRk||!cur)return;const t=rankText();if(hudRk.textContent!==t)hudRk.textContent=t}
function decorate(h){
 lastH=h;
 const o=$('ov'),pn=o&&o.querySelector('.pn');if(!pn||!cur)return;
 pn.querySelectorAll('.prf-card').forEach(n=>n.remove());
 const kind={'LUNAR RESCUE':'menu','RESCUE COMPLETE':'win','MISSION FAILED':'fail','SETTINGS':'set'}[h];
 const small=['HANGAR','PAUSED','CONTROLS / HOW TO PLAY'].includes(h);
 if(!kind&&!small)return;
 const a=avOf(cur),s=asOf(cur),nm=esc(cur.name);
 const line={menu:'Ready for mission',win:'Well flown, Commander '+nm,fail:'Shake it off, Commander '+nm+'. Try again',set:'Astronaut profile'}[kind]||'Ready for mission';
 let html='<div class="prf-card prf-'+(kind||'small')+'"><img class="c-av" src="'+a.src+'" alt="" draggable="false"><div class="c-t"><b>'+nm+'</b><span>'+esc(rankText())+'</span>'+(kind?'<span class="c-s">'+line+'</span>':'')+'</div>';
 if(kind==='set')html+='<button type="button" class="c-edit" data-prf="edit">&#9998; EDIT PROFILE</button>';
 if(kind)html+='<img class="c-fig" src="'+s.src+'" alt="" draggable="false">';
 html+='</div>';
 pn.insertAdjacentHTML('afterbegin',html);
 const b=pn.querySelector('[data-prf="edit"]');if(b)b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();try{G().aud&&G().aud()}catch(_){}openEditor()});
}
function refreshAll(){refreshImgs();paintHud();decorate(lastH)}

/* ---------- boot ---------- */
function init(){
 cur=read();
 if(cur){refreshAll();startGame();return}
 // first launch: hold the game back until the profile exists
 try{G().setIntro&&G().setIntro(true)}catch(e){}
 const ov=$('ov');if(ov)ov.classList.add('hide');
 buildHud();
 show('create');
}
try{init()}catch(err){console.error('Profile system failed, starting game without it:',err);try{if(!started){started=true;window.LR_RUN_INTRO&&window.LR_RUN_INTRO()}}catch(e){console.error(e)}}
})();
</script>

</body></html>
